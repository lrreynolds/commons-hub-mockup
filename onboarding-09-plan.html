<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Commonshub — Guided onboarding</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    :root{
      --console-bg:#f7faf8;
      --console-tint:rgba(31,111,74,.06);
      --console-tint-2:rgba(31,111,74,.1);
      --console-border:rgba(31,111,74,.14);
    }

    .consoleShell{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .consoleHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:4px 2px 0;
      flex-wrap:wrap;
    }

    .consoleHeader .title{
      font-size:13px;
      color:var(--muted);
    }

    .consoleHeader .title b{
      color:var(--text);
      font-weight:900;
    }

    .consoleStream{
      flex:1;
      border:1px solid var(--line);
      border-radius:22px;
      background:linear-gradient(to bottom, rgba(16,32,24,.02), rgba(16,32,24,.005));
      padding:16px;
      overflow:auto;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
      min-height:180px;
    }

    .msg{
      border:1px solid var(--console-border);
      background:#fff;
      border-radius:18px;
      padding:14px 15px;
      margin-bottom:12px;
    }

    .msg.system{
      background:var(--console-bg);
      border-color:var(--console-tint-2);
    }

    .metaLine{
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .metaLine b{
      color:var(--text);
      font-weight:900;
    }

    .msg p{
      margin:0;
      font-size:14px;
      line-height:1.45;
      color:var(--text);
    }

    .msg p + p{
      margin-top:9px;
    }

    .inputBar{
      border:1px solid var(--line);
      border-radius:22px;
      background:#fff;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .fieldLabel{
      font-size:13px;
      font-weight:800;
      color:var(--text);
      margin-bottom:2px;
    }

    .inputField{
      width:100%;
      min-height:60px;
      resize:none;
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px 15px;
      font:inherit;
      color:var(--text);
      background:#fcfdfc;
      outline:none;
    }

    input.inputField{
      min-height:60px;
       text-align: left;
    }

    textarea.inputField {
  text-align: left;
}
    .inputField:focus{
      border-color:rgba(31,111,74,.28);
      box-shadow:0 0 0 3px rgba(31,111,74,.08);
    }

    .continueBtn{
      appearance:none;
      border:none;
      border-radius:18px;
      background:#1f6f4a;
      color:#fff;
      font:inherit;
      font-weight:900;
      font-size:17px;
      padding:16px 18px;
      cursor:pointer;
      box-shadow:0 10px 18px rgba(31,111,74,.16);
      width:100%;
      text-align:center;
      text-decoration:none;
      margin-top:4px;
    }

    .subtleRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:12px;
      padding:0 2px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--muted);
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:700;
    }

    .flowRail{
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:10px;
      margin-top:14px;
    }

    .flowRail .node{
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:12px;
      min-height:74px;
    }

    .flowRail .node b{
      display:block;
      font-size:13px;
      margin-bottom:4px;
    }

    .flowRail .node span{
      font-size:12px;
      color:var(--muted);
      line-height:1.4;
      display:block;
    }

    .flowRail .node.current{
      background:rgba(31,111,74,.06);
      border-color:rgba(31,111,74,.18);
    }

    .choiceItem{
      width:100%;
      text-align:left;
      border:1px solid var(--line);
      background:#fff;
      border-radius:18px;
      padding:14px 16px;
      cursor:pointer;
      transition:.18s ease;
      display:block;
    }

    .choiceItem:hover{
      border-color:rgba(31,111,74,.22);
      background:rgba(31,111,74,.025);
    }

    .choiceItem.active{
      background:rgba(31,111,74,.04);
      border:2px solid #1f6f4a;
      box-shadow:0 0 0 3px rgba(31,111,74,.08);
    }

    .choiceTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .choiceValue{
      font-size:15px;
      font-weight:900;
      line-height:1.3;
      word-break:break-word;
      flex:1;
      color:var(--text);
    }

    .choiceBadge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(31,111,74,.22);
      background:#fff;
      color:#1f6f4a;
      border-radius:999px;
      padding:4px 8px;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
      flex-shrink:0;
    }


    @media (max-width: 1100px){
      .flowRail{
        grid-template-columns:repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 720px){
      .flowRail{
        grid-template-columns:1fr;
      }

      .consoleShell{
        min-height:auto;
      }
    }

    @media (max-width: 640px){
      .flowBanner{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
      }

      .flowBanner .stepChip{
        align-self:flex-start;
      }
      .consoleStream{
        padding:12px;
        border-radius:16px;
      }
      .consoleShell{
        gap:10px;
      }
      .msg{
        padding:12px;
        border-radius:14px;
      }

      .inputBar{
        padding:12px;
        border-radius:16px;
        gap:10px;
      }
      .inputField{
        font-size:16px;
      }

      .choiceItem{
        padding:12px 14px;
        border-radius:14px;
      }

      .choiceTop{
        align-items:flex-start;
        gap:10px;
      }

      .choiceValue{
        font-size:14px;
      }

      .choiceBadge{
        font-size:10px;
        padding:4px 7px;
      }
    }


  </style>
</head>
<body class="flow">
  <div class="flowRoot">
    <div class="wrap">
      <main class="stage">

        <div class="topbar">
          <div class="left">
            <div class="logoMark"></div>
            <div class="meta">
              <b>Set up your community</b>
              <span>Choose a simple plan</span>
            </div>
          </div>
          <div class="chip">Step 1 of 4</div>
        </div>

        <div class="content">
          <div class="center">

            <div class="flowBanner">
              <div>
                <b>Pick a plan</b>
                <div class="muted" style="margin-top:6px;">
                  Start simple. You can upgrade as your community grows.
                </div>
              </div>
              <div class="stepChip">5-minute setup</div>
            </div>

            <div class="progress">
              <span>Setup</span>
              <div class="bar"><div style="width:25%"></div></div>
              <span>~2 minutes</span>
            </div>

            <div class="card" style="margin-top:14px;">

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">

                <!-- Starter Plan -->
                <button class="choiceItem active" type="button">
                  <div style="display:flex; flex-direction:column; gap:10px;">

                    <div class="choiceTop">
                      <span class="choiceValue">Starter</span>
                    </div>

                    <div style="font-size:26px; font-weight:900;">
                      $24.99<span style="font-size:14px; font-weight:600;">/mo</span>
                    </div>

                    <div class="muted" style="font-size:13px;">
                      or $249.99/year
                    </div>

                    <div class="msg" style="margin:0;">
                      <p><b>Commons subdomain</b></p>
                      <p class="muted">securitybrief.commonshub.social</p>
                    </div>

                    <div class="msg" style="margin:0;">
                      <p>Hosted Mastodon community</p>
                      <p class="muted">Fully managed</p>
                    </div>

                    <div class="msg" style="margin:0;">
                      <p>Basic funding tools</p>
                      <p class="muted">Memberships + tips</p>
                    </div>

                    <div class="msg" style="margin:0;">
                      <p>Backups + monitoring</p>
                    </div>

                    <div class="msg system" style="margin:0;">
                      <p>Best for getting started quickly with no setup overhead.</p>
                    </div>

                  </div>
                </button>

                <!-- Growth Plan -->
                <button class="choiceItem" type="button">
                  <div style="display:flex; flex-direction:column; gap:10px;">

                    <div class="choiceTop">
                      <span class="choiceValue">Growth</span>
                      <span class="choiceBadge">Recommended</span>
                    </div>

                    <div style="font-size:26px; font-weight:900;">
                      $39.99<span style="font-size:14px; font-weight:600;">/mo</span>
                    </div>

                    <div class="muted" style="font-size:13px;">
                      or $399.99/year
                    </div>

                    <div class="msg" style="margin:0;">
                      <p><b>Custom domain or subdomain</b></p>
                      <p class="muted">securitybrief.jasonjaysmart.com</p>
                    </div>

                    <div class="msg" style="margin:0;">
                      <p>Everything in Starter</p>
                    </div>

                    <div class="msg" style="margin:0;">
                      <p>Domain setup guidance</p>
                      <p class="muted">We help or do it with you</p>
                    </div>

                    <div class="msg" style="margin:0;">
                      <p>Priority support</p>
                    </div>

                    <div class="msg system" style="margin:0;">
                      <p>Best for branded communities and existing audiences.</p>
                    </div>

                  </div>
                </button>

              </div>

              <div class="msg system" style="margin-top:16px;">
                <p><b>Simple billing:</b> pay monthly or yearly. Cancel anytime.</p>
              </div>

              <div style="display:flex; gap:12px; margin-top:12px;">
                <a class="secondary" href="onboarding-08-review.html" style="flex:1;">Back</a>
                <a class="continueBtn" href="onboarding-10-domain.html" style="flex:2;">Continue →</a>
              </div>

            </div>

          </div>
        </div>

      </main>
    </div>
  </div>
</body>
</html>
