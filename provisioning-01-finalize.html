<script>
  const registrarSelect = document.getElementById('registrarSelect');
  const registrarStatus = document.getElementById('registrarStatus');
  const registrarBody = document.getElementById('registrarBody');
  const registrarNote = document.getElementById('registrarNote');

  const domainControlWrap = document.getElementById('domainControlWrap');
  const domainControlText = document.getElementById('domainControlText');
  const domainControlCheck = document.getElementById('domainControlCheck');

 const continueBtn = document.getElementById('continueCustom');

  const supportedRegistrars = new Set([
    'godaddy',
    'cloudflare',
    'namecheap',
    'squarespace',
    'wix',
    'hostinger',
    'ionos',
    'bluehost'
  ]);

 function updateContinueState() {
  const val = registrarSelect.value;
  const needsAck = (val === 'other' || val === 'unknown');

  if (!needsAck || domainControlCheck.checked) {
    continueBtn.classList.remove('is-disabled');
  } else {
    continueBtn.classList.add('is-disabled');
  }
}

  function updateRegistrarState() {
    const val = registrarSelect.value;
    domainControlCheck.checked = false;

    if (supportedRegistrars.has(val)) {
      const label = registrarSelect.options[registrarSelect.selectedIndex].text;
      registrarStatus.textContent = label + ' selected';
      registrarBody.innerHTML = '<b>Good news:</b> for some major registrars like ' + label + ', we may be able to help with DNS setup during provisioning.';
      registrarNote.textContent = 'You’ll still confirm the final address now. DNS setup happens after billing while the server is being provisioned.';
      domainControlWrap.style.display = 'none';
    } else if (val === 'other') {
      registrarStatus.textContent = 'Manual setup likely';
      registrarBody.innerHTML = '<b>Heads up:</b> if your registrar is not one of our supported providers, you may need to add DNS records manually during setup.';
      registrarNote.textContent = 'We’ll still use this address if you confirm it now, but DNS changes may need to be completed by you after billing.';
      domainControlWrap.style.display = 'block';
      domainControlText.textContent = 'Because your registrar is not listed, you may be responsible for updating DNS records yourself.';
    } else if (val === 'unknown') {
      registrarStatus.textContent = 'Ownership check needed';
      registrarBody.innerHTML = '<b>Please confirm:</b> Commonshub can only use this address if you control the domain or can get its DNS records changed.';
      registrarNote.textContent = 'If you are not sure who manages this domain, it may be safer to switch to a Commonshub address before continuing.';
      domainControlWrap.style.display = 'block';
      domainControlText.textContent = 'If you do not know who manages this domain, you may not be able to complete setup for this address.';
    }

    updateContinueState();
  }

  registrarSelect.addEventListener('change', updateRegistrarState);
  domainControlCheck.addEventListener('change', updateContinueState);

  updateRegistrarState();
</script>
<script>
  const modeCustom = document.getElementById('modeCustom');
  const modeCommons = document.getElementById('modeCommons');

  const customSection = document.getElementById('customSection');
  const commonsSection = document.getElementById('commonsSection');

  function setMode(mode) {
    const isCustom = mode === 'custom';

    modeCustom.classList.toggle('active', isCustom);
    modeCommons.classList.toggle('active', !isCustom);

    const customBadge = modeCustom.querySelector('.choiceBadge');
    const commonsBadge = modeCommons.querySelector('.choiceBadge');

    if (customBadge) customBadge.remove();
    if (commonsBadge) commonsBadge.remove();

    const badge = document.createElement('span');
    badge.className = 'choiceBadge';
    badge.textContent = 'Selected';

    if (isCustom) {
      modeCustom.querySelector('.choiceTop').appendChild(badge);
      customSection.style.display = '';
      commonsSection.style.display = 'none';
    } else {
      modeCommons.querySelector('.choiceTop').appendChild(badge);
      customSection.style.display = 'none';
      commonsSection.style.display = '';
    }
  }

  modeCustom.addEventListener('click', () => setMode('custom'));
  modeCommons.addEventListener('click', () => setMode('commons'));
</script>
<script>
  const commonsField = document.getElementById('commonsField');
  const commonsFieldLabel = document.getElementById('commonsFieldLabel');
  const commonsPresets = document.querySelectorAll('.commonsPreset');

  function getActiveCommonsValue() {
    const active = document.querySelector('.commonsPreset.active');
    return active ? active.dataset.value.trim() : '';
  }

  commonsPresets.forEach(btn => {
    btn.addEventListener('click', () => {
      commonsPresets.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      commonsField.value = btn.dataset.value;
      commonsFieldLabel.textContent = 'Selected (edit if needed)';
    });
  });

  commonsField.addEventListener('input', () => {
    const activeValue = getActiveCommonsValue();
    const currentValue = commonsField.value.trim();

    if (!activeValue) {
      commonsFieldLabel.textContent = currentValue ? 'Edited value' : 'Selected (edit if needed)';
      return;
    }

    if (currentValue !== activeValue) {
      commonsPresets.forEach(b => b.classList.remove('active'));
      commonsFieldLabel.textContent = currentValue ? 'Edited value' : 'Selected (edit if needed)';
    } else {
      commonsFieldLabel.textContent = 'Selected (edit if needed)';
    }
  });
</script>
<script>
  const customField = document.getElementById('customDomainField');
  const customHint = document.getElementById('customDomainHint');

  function looksLikeHost(value) {
    const v = value.trim();
    if (!v) return false;
    if (v.includes('http://') || v.includes('https://')) return false;
    if (v.includes('/')) return false;
    return /^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/.test(v);
  }

  customField.addEventListener('input', () => {
    if (looksLikeHost(customField.value)) {
      customHint.textContent = 'Looks like a valid domain or subdomain.';
      customHint.style.color = '';
    } else {
      customHint.textContent = 'Enter a domain or subdomain only — not a full URL.';
      customHint.style.color = '#b42318';
    }
  });
</script>
