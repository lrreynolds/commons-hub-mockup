<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Commonshub — Onboarding</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body class="flow flowDark">
  <div class="flowRoot">
    <div class="wrap">
      <main class="stage">
        <div class="content">
          <div class="center">

            <!-- Header -->
            <div class="appHeader">
              <div class="appBrand">
                <img src="assets/commonshub-mark-light.svg" alt="" class="appMark">
                <span>Commonshub — Onboarding</span>
              </div>
              <div class="chip">Step 3</div>
            </div>

            <!-- Progress -->
            <div class="progress">
              <div class="bar"><div style="width:42%"></div></div>
              <span>~1 minute</span>
            </div>

            <!-- Card -->
            <section class="onboardCard">

              <div class="onboardIntro">
                <h1 class="onboardTitle">
                  Choose a short description for your community
                </h1>

                <p class="onboardLead">
                  This defines who it’s for and what happens there.
                </p>
              </div>

              <!-- Content -->
              <div class="formSection">

                <div class="choiceStack">

                  <button type="button" class="choiceItem">
                    <div class="choiceTop">
                      <span class="choiceValue">Option A</span>
                      <span class="choiceBadge">Recommended</span>
                    </div>
                    <div class="choiceBody">
                      A real-time signal space for analysts tracking authoritarian power, war strategy, and reputational politics.
                    </div>
                  </button>

                  <button type="button" class="choiceItem">
                    <div class="choiceTop">
                      <span class="choiceValue">Option B</span>
                    </div>
                    <div class="choiceBody">
                      An ongoing briefing room for national security professionals following Russia, Ukraine, and global strategic conflict.
                    </div>
                  </button>

                  <button type="button" class="choiceItem active">
                    <div class="choiceTop">
                      <span class="choiceValue">Option C</span>
                    </div>
                    <div class="choiceBody">
                      A working room for researchers, journalists, and operators analyzing power, propaganda, and geopolitical strategy.
                    </div>
                  </button>

                  <button type="button" class="choiceItem">
                    <div class="choiceTop">
                      <span class="choiceValue">Option D</span>
                    </div>
                    <div class="choiceBody">
                      A signal space for people already working on national security, strategic risk, and authoritarian networks.
                    </div>
                  </button>

                </div>

                <p class="subtleAction">
                  Not quite right? <a href="#">Generate more options</a>
                </p>

                <div class="note">
                  <b>Recommended:</b> Option A — but Option C works well for a more collaborative, working-room tone.
                </div>

                <div>
                  <label class="fieldLabel">Selected (edit if needed)</label>
                  <textarea class="inputField" id="positioningField">A working room for researchers, journalists, and operators analyzing power, propaganda, and geopolitical strategy.</textarea>
                </div>

                <div class="actionRow">
                  <a class="primary forward" href="onboarding-04-name.html">
                    Continue
                  </a>
                </div>

              </div>

            </section>

          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const field = document.getElementById('positioningField');
    const label = document.querySelector('.fieldLabel');
    const choices = document.querySelectorAll('.choiceItem');

    function activeChoice() {
      return document.querySelector('.choiceItem.active');
    }

    function choiceText(choice) {
      return choice?.querySelector('.choiceBody')?.innerText.trim() || '';
    }

    function syncStateFromField() {
      const active = activeChoice();
      const activeValue = choiceText(active);
      const currentValue = field.value.trim();

      if (active && currentValue !== activeValue) {
        active.classList.remove('active');
        label.textContent = 'Edited value';
      } else {
        label.textContent = 'Selected (edit if needed)';
      }
    }

    choices.forEach(choice => {
      choice.addEventListener('click', () => {
        choices.forEach(c => c.classList.remove('active'));
        choice.classList.add('active');
        field.value = choiceText(choice);
        label.textContent = 'Selected (edit if needed)';
        field.focus();
      });
    });

    field.addEventListener('input', syncStateFromField);
    syncStateFromField();
  </script>
</body>
</html>
