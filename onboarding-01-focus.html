<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Commonshub — Onboarding</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body class="flow flowDark">
  <div class="flowRoot">
    <div class="wrap">
      <main class="stage">
        <div class="content">
          <div class="center">

            <!-- Header -->
            <div class="appHeader">
              <div class="appBrand">
                <img src="assets/commonshub-mark-light.svg" alt="" class="appMark">
                <span>Commonshub — Onboarding</span>
              </div>
              <div class="chip">Step 2</div>
            </div>

            <!-- Progress -->
            <div class="progress">
              <div class="bar"><div style="width:35%"></div></div>
              <span>~1 minute</span>
            </div>

            <!-- Card -->
            <section class="onboardCard">

              <div class="onboardIntro">

                <h1 class="onboardTitle">
                  Your focus for this community
                </h1>

                <p class="onboardLead">
                  Add a short description and (optionally) a few links.
                </p>

                <p class="onboardSupport">
                  We’ll use this to suggest positioning, naming, and setup defaults.
                </p>
              </div>

              <!-- Form -->
              <div class="formSection">

                <!-- Focus -->
                <div>
                  <label class="fieldLabel">
                    Core Focus
                  </label>

                 <input
  type="text"
  class="inputField"
  placeholder="5–10 words (Keep it brief)"
/>
               
                </div>

                <!-- Links -->
                <div>
                  <label class="fieldLabel">
                    Optional public links
                  </label>

                  <p class="fieldHelp">
                    Website, Substack, YouTube, or any links that represent your work or identity.
                  </p>

                  <textarea
                    class="inputField inputField--links"
                    placeholder="https://yourdomain.com
https://youtube.com/@yourchannel
https://substack.com/@you"
                  ></textarea>
                </div>

                <!-- CTA -->
                <div class="actionRow">
                  <a class="primary forward" href="onboarding-03-positioning.html">
                    Continue
                  </a>
                </div>

              </div>

            </section>

          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
